server:
  port: 8080

spring:
  datasource:
    url: ${LAMB_DB_URL:jdbc:oracle:thin:@localhost:1522/FREEPDB1}
    username: ${LAMB_DB_USERNAME:LAMB_APP}
    password: ${LAMB_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crean los scripts revisados de infra/oracle (no Hibernate).
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          fetch_size: 100
    show-sql: false

  # Keycloak (S10b 7.1): issuer-uri valida firma (JWKS del realm) y que el claim iss coincida.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${LAMB_KEYCLOAK_ISSUER:http://localhost:48080/realms/lamb-academic}

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    pe.edu.upeu.lambacademic: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      show-details: always

lamb:
  cors:
    # Lista separada por comas. Nunca "*" (ver S5 3.7).
    allowed-origins: http://localhost:4200
  matricula:
    # Prerrequisitos (PENDIENTES A1): APROBADO exige resultado APROBADO registrado en un
    # periodo anterior. CURSADO_TEMPORAL acepta cursos sin resultado (solo transicion).
    # NINGUNA desactiva la regla.
    prerrequisitos:
      politica: APROBADO
    # Cuotas por defecto del cargo de matricula cuando la solicitud no las indica.
    cuotas-por-defecto: 5
